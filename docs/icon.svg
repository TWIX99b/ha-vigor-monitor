<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <rect x="48" y="304" width="416" height="146" rx="38"/>
    </clipPath>
  </defs>
  <!-- signal / monitoring pulse -->
  <path d="M40 180 H160 L198 70 L250 264 L294 128 L320 180 H472"
        fill="none" stroke="url(#pulse)" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feet -->
  <rect x="100" y="438" width="64" height="28" rx="9" fill="#1E3A8A"/>
  <rect x="348" y="438" width="64" height="28" rx="9" fill="#1E3A8A"/>
  <!-- modem body -->
  <rect x="48" y="304" width="416" height="146" rx="38" fill="url(#body)"/>
  <rect x="48" y="304" width="416" height="30" fill="#FFFFFF" opacity="0.18" clip-path="url(#bodyClip)"/>
  <!-- status LEDs -->
  <circle cx="118" cy="388" r="17" fill="#4ADE80"/>
  <circle cx="174" cy="388" r="17" fill="#4ADE80"/>
  <circle cx="230" cy="388" r="17" fill="#FBBF24"/>
  <!-- vent slot -->
  <rect x="290" y="378" width="132" height="20" rx="10" fill="#FFFFFF" opacity="0.35"/>
</svg>
